<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DishX - Restaurant Finder</title>

    <!-- A projekt saját stílusa -->
    <link rel="stylesheet" href="../css.css">

    <!-- Leaflet + marker clustering (sok pont csoportosítva jelenik meg) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

    <!-- Csak az étteremkeresőhöz kellő kiegészítések (a css.css-t nem módosítja) -->
    <style>
        .finder-wrap {
            max-width: 1100px;
            margin: 24px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .finder-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 22px;
        }

        .finder-form input,
        .finder-form select {
            flex: 1;
            min-width: 180px;
            max-width: 260px;
            padding: 13px 18px;
            font-size: 15px;
            border: 2px solid #dfcdbb;
            border-radius: 30px;
            background: #ffffff;
            color: #4a382c;
            outline: none;
            font-family: Arial, sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .finder-form input:focus,
        .finder-form select:focus {
            border-color: #b89b7d;
            box-shadow: 0 6px 24px rgba(184, 155, 125, 0.25);
        }

        .finder-form button {
            padding: 13px 28px;
            background: #5a4030;
            color: #fffaf4;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .finder-form button:hover {
            background: #4a382c;
            transform: translateY(-2px);
        }

        #resultStatus {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #806653;
            margin-top: 14px;
        }

        #map {
            position: relative;
            z-index: 0; /* a sticky fejléc fölött ne jelenjen meg */
            height: 580px;
            border: 1px solid #dfcdbb;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(91, 66, 48, 0.07);
        }

        .popup-title {
            font-family: Georgia, serif;
            font-size: 16px;
            font-weight: bold;
            color: #5a4030;
            margin-bottom: 4px;
        }

        .popup-line {
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #6f5a49;
            margin-top: 2px;
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">DishX</a>

            <nav class="nav-links">
                <a href="index.html" class="nav-item">Home Feed</a>
                <a href="explore.html" class="nav-item">Explore</a>
                <a href="restaurants.html" class="nav-item active">Restaurants</a>
                <a href="bookmarks.html" class="nav-item">Bookmarks</a>
                <a href="personal page.html" class="nav-item">My Profile</a>
            </nav>
        </div>
    </header>

    <main class="finder-wrap">

        <section class="explore-top-section">
            <h1 class="explore-title">Find a Restaurant</h1>
            <p class="explore-subtitle">Search by name, by city, or both. Leave a field empty to ignore it.</p>

            <form id="finderForm" class="finder-form" autocomplete="off">
                <input type="text" id="nameInput" placeholder="Restaurant name">
                <input type="text" id="cityInput" placeholder="City">
                <select id="netSelect">
                    <option value="any">Internet: not needed</option>
                    <option value="yes">Internet: needed</option>
                </select>
                <button type="submit">Search</button>
            </form>

            <p id="resultStatus">Loading restaurants...</p>
        </section>

        <div id="map"></div>

    </main>

    <!-- A Leaflet klasszikus script, ezért a modul előtt töltődik be -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script type="module" src="../scripts/restaurants.js"></script>
</body>

</html>
