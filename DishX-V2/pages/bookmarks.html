<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DishX - Bookmarks</title>
    <link rel="stylesheet" href="../css.css">
</head>

<body>

    <!-- =========================
         MAIN LAYOUT
         ========================= -->
    <div class="app-layout">

        <!-- LEFT SIDEBAR -->
        <aside class="left-sidebar">
            <div class="sidebar-menu">
                <a href="index.html" class="brand-logo sidebar-brand">
                    DishX
                </a>
                <a href="index.html" class="menu-link">
                    <span>Home</span>
                </a>
                <a href="explore.html" class="menu-link">
                    <span>Explore</span>
                </a>
                <a href="bookmarks.html" class="menu-link active">
                    <span>Bookmarks</span>
                </a>
                <a href="restaurants.html" class="menu-link">
                    <span>Restaurants</span>
                </a>
                <a href="personal page.html" class="menu-link">
                    <span>Profile</span>
                </a>

                <button class="btn-post-primary" onclick="window.location.href='index.html#postTextInput'">
                    + Share Recipe
                </button>
            </div>

            <a href="personal page.html" class="sidebar-user-card" title="Open My Profile">
                <img src="https://placehold.co/600x400/d8c3ad/5a4030?text=Krisztina" alt="Krisztina">
                <div class="user-card-names">
                    <span class="user-card-name">Krisztina</span>
                    <span class="user-card-handle">@chef_krisztina</span>
                </div>
            </a>
        </aside>

        <!-- CENTER BOOKMARKS CONTENT -->
        <main class="main-feed" style="grid-column: span 2;">

            <div class="bookmarks-header-card">
                <!--Generated by JavaScript in bookmarks.js-->
            </div>

            <!-- CONTAINER SHOWING ONLY SAVED RECIPES -->
            <div id="bookmarksContainer" class="feed-timeline">
                <!-- JavaScript populates saved recipes here -->
            </div>

        </main>

    </div>

    <!-- SCRIPTS -->
    <script src="../scripts/feed.js"></script>
    <script src="../scripts/app.js"></script>
    <script type="module" src="../scripts/bookmarks.js"></script>
</body>

</html>
