<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DishX - Explore Recipes</title>
    <link rel="stylesheet" href="../css.css">
</head>

<body>

    <!-- =========================
         MAIN LAYOUT
         ========================= -->
    <div class="app-layout">

        <!-- LEFT SIDEBAR -->
        <aside class="left-sidebar">
            <div class="sidebar-menu">
                <a href="index.html" class="brand-logo sidebar-brand">
                    DishX
                </a>
                <a href="index.html" class="menu-link">
                    <span>Home</span>
                </a>
                <a href="explore.html" class="menu-link active">
                    <span>Explore</span>
                </a>
                <a href="bookmarks.html" class="menu-link">
                    <span>Bookmarks</span>
                </a>
                <a href="restaurants.html" class="menu-link">
                    <span>Restaurants</span>
                </a>
                <a href="personal page.html" class="menu-link">
                    <span>Profile</span>
                </a>

                <button class="btn-post-primary" onclick="window.location.href='index.html#postTextInput'">
                    + Share Recipe
                </button>
            </div>

            <a href="personal page.html" class="sidebar-user-card" title="Open My Profile">
                <img src="https://placehold.co/600x400/d8c3ad/5a4030?text=Krisztina" alt="Krisztina">
                <div class="user-card-names">
                    <span class="user-card-name">Krisztina</span>
                    <span class="user-card-handle">@chef_krisztina</span>
                </div>
            </a>
        </aside>

        <!-- CENTER EXPLORE CONTENT -->
        <main class="main-feed" style="grid-column: span 2;">

            <!-- SEARCH BAR AT THE TOP CENTER COVERING THE TOP -->
            <section class="explore-top-section">
                <h1 class="explore-title">Explore Delicious Recipes</h1>
                <p class="explore-subtitle">Discover popular dishes, homemade secret recipes, and culinary creations from top chefs around the world.</p>
                
                <div class="explore-search-wrapper">
                    <span class="explore-search-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input type="text" id="exploreSearchInput" class="explore-search-input" placeholder="Search recipes by name, ingredients, tags or chef (e.g. Pasta, Chocolate, Sourdough)...">
                </div>

                <div class="explore-tags-row">
                    <button class="explore-tag-pill active" data-tag="all">All Dishes</button>
                    <button class="explore-tag-pill" data-tag="baking">Baking</button>
                    <button class="explore-tag-pill" data-tag="pasta">Pasta</button>
                    <button class="explore-tag-pill" data-tag="italian">Italian</button>
                    <button class="explore-tag-pill" data-tag="bread">Bread</button>
                    <button class="explore-tag-pill" data-tag="desserts">Desserts</button>
                    <button class="explore-tag-pill" data-tag="quickmeals">Quick Meals</button>
                </div>
            </section>

            <!-- PICTURES OF RECIPES GRID (CLICK TO VIEW ACTUAL POST) -->
            <section class="explore-grid" id="exploreGrid">
                <!-- JavaScript populates recipe picture cards here -->
            </section>

        </main>

    </div>

    <!-- SCRIPTS -->
    <script src="../scripts/feed.js"></script>
    <script src="../scripts/app.js"></script>
    <script type="module" src="../scripts/explorer.js"></script>
</body>

</html>
