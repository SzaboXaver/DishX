<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DishX - Login</title>
    <link rel="stylesheet" href="../login.css">
</head>

<body>

    <form class="login-form">
        <h1>Login</h1>
        <label for="loginEmail">Email:</label>
        <input placeholder="Email:..." type="email" id="loginEmail" name="email" required>
        <br>
        <label for="loginPassword">Password:</label>
        <input placeholder="Password:..." type="password" id="loginPassword" name="password" required>
        <br>
        <button id="loginBtn" type="submit">Login</button>
        <h3>Don't have an account? <a href="register.html">Register here!</a></h3>
    </form>

    <script type="module" src="../scripts/login.js"></script>
</body>

</html>
