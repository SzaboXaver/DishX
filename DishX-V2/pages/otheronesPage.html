<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="../css.css">
</head>

<body>

    <!-- =========================
         MAIN LAYOUT
         ========================= -->
    <div class="app-layout">

        <!-- LEFT SIDEBAR -->
        <aside class="left-sidebar">
            <div class="sidebar-menu">
                <a href="index.html" class="brand-logo sidebar-brand">
                    DishX
                </a>
                <a href="index.html" class="menu-link">
                    <span>Home</span>
                </a>
                <a href="explore.html" class="menu-link">
                    <span>Explore</span>
                </a>
                <a href="bookmarks.html" class="menu-link">
                    <span>Bookmarks</span>
                </a>
                <a href="restaurants.html" class="menu-link">
                    <span>Restaurants</span>
                </a>
                <a href="personal page.html" class="menu-link">
                    <span>Profile</span>
                </a>

                <button class="btn-post-primary" onclick="window.location.href='index.html#postTextInput'">
                    + Share Recipe
                </button>
            </div>
        </aside>

        <!-- CENTER PROFILE CONTENT -->
        <main class="main-feed" style="grid-column: span 2;">

            <div style="max-width: 700px; margin: 0 auto; width: 100%;">

                <!-- =========================
                     PROFILE
                     ========================= -->

                <div class="profile">
                    <!--Generated by JavaScript in otherProfile.js-->
                </div>


                <!-- =========================
                     TIKTOK-STYLE TAB SWITCHER
                     ========================= -->

                <div class="profile-tabs-header">
                    <button class="profile-tab active" data-profile-tab="my-recipes">Recipes</button>
                    <button class="profile-tab" data-profile-tab="favorites">Favorite Recipes</button>
                </div>

                <!-- RECIPES GRID -->
                <div class="profile-tab-content active" id="myRecipesTab">
                    <div class="profile-recipe-grid" id="myRecipes">
                        <!-- JavaScript puts recipes here -->
                    </div>
                </div>

                <!-- FAVORITE RECIPES GRID -->
                <div class="profile-tab-content" id="favoritesTab">
                    <div class="profile-recipe-grid" id="favoriteRecipes">
                        <!-- JavaScript puts recipes here -->
                    </div>
                </div>

            </div>

        </main>

    </div>

    <script src="../scripts/favorite.js"></script>
    <script src="../scripts/app.js"></script>
    <script type="module" src="../scripts/otherProfile.js"></script>

</body>

</html>
